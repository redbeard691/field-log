<!doctype html>
<!-- Field Log – Week page: totals, chart and every job in the week. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Week · Field Log</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Field Log">
<meta name="theme-color" content="#F2B705">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="css/styles.css">
<script src="js/common.js" defer></script>
<script src="js/week.js" defer></script>
</head>
<body>

<!-- Header (same on every page) -->
<header class="band">
  <div class="wrap">
    <div class="brand">Field Log<small id="todayLabel">Today</small></div>
    <div class="weekpill"><b id="headWeek">0.00</b><span>hrs this week</span></div>
  </div>
</header>

<main>
  <section class="wrap">
    <div class="weeknav">
      <button type="button" class="arrow prevWk" aria-label="Previous week">‹</button>
      <div class="wk"><span class="wkLabel"></span><small class="wkRange"></small></div>
      <button type="button" class="arrow nextWk" aria-label="Next week">›</button>
    </div>
    <div class="stats" id="weekStats"></div>
    <div>
      <div class="bars" id="weekBars"></div>
      <div class="barlabels" id="weekBarLabels"></div>
    </div>
    <div id="weekDays" style="display:flex;flex-direction:column;gap:20px"></div>
  </section>
</main>

<!-- Tab bar (same on every page; aria-current marks this page) -->
<nav class="tabs" aria-label="Sections">
  <div class="wrap">
    <a href="index.html"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>Log</a>
    <a href="week.html" aria-current="page"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Week</a>
    <a href="timesheet.html"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h9l4 4v14H6z"/><path d="M14 3v5h5M9 13h7M9 17h7"/></svg>Timesheet</a>
    <a href="backup.html"><svg viewBox="0 0 24 24" aria-hidden="true"><ellipse cx="12" cy="6" rx="7" ry="3"/><path d="M5 6v6c0 1.7 3.1 3 7 3s7-1.3 7-3V6M5 12v6c0 1.7 3.1 3 7 3s7-1.3 7-3v-6"/></svg>Backup</a>
  </div>
</nav>

</body>
</html>
